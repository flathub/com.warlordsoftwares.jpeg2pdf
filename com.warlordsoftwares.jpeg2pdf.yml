app-id: com.warlordsoftwares.jpeg2pdf
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: 5.15-25.08
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
command: jpeg2pdf.sh
rename-icon: icon
rename-desktop-file: jpeg2pdf.desktop
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-run/gvfsd
  - --device=dri
  - --socket=pulseaudio
cleanup:
  - /share/man
modules:
  - python3-req.json
  - name: jpeg2pdf
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/jpeg2pdf
      - cp -r * ${FLATPAK_DEST}/jpeg2pdf
      - install -Dm755 ${FLATPAK_DEST}/jpeg2pdf/jpeg2pdf.sh -t ${FLATPAK_DEST}/bin/
      - install -Dm644 ${FLATPAK_DEST}/jpeg2pdf/share/icons/icon.png -t ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/
      - install -Dm644 ${FLATPAK_DEST}/jpeg2pdf/share/applications/jpeg2pdf.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 ${FLATPAK_DEST}/jpeg2pdf/share/metainfo/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
    license-files:
      - share/license/LICENSE
    cleanup:
      - /jpeg2pdf/share
    sources:
      - type: archive
        url: https://github.com/rishabh3354/FLATPAK_JPEG2PDF/archive/refs/tags/2026.7.2.tar.gz
        sha256: 981b83a8771c4766ee30d713f1563ef40d90d4bb64612bd8231be8dd0007fc96
