app-id: com.warlordsoftwares.jpeg2pdf
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: 5.15-25.08
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
command: jpeg2pdf.sh

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-run/gvfsd
  - --device=dri
  - --socket=pulseaudio

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
modules:
  - python3-req.json

  # OCR engine for "Searchable PDF": Leptonica (image library), Tesseract and its language data
  - name: leptonica
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_PROG=OFF
      - -DSW_BUILD=OFF
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
        sha256: c73363397f96eb1295602bf44d708a994ad42046c791bf03ea0505d829bdb6a7

  - name: tesseract
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DGRAPHICS_DISABLED=ON
      - -DDISABLE_CURL=ON
      - -DDISABLE_ARCHIVE=ON
      - -DOPENMP_BUILD=OFF
      - -DENABLE_LTO=OFF
      # built-in language data location: /app/share/tessdata
      - -DTESSDATA_PREFIX=/app/share
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
        sha256: 9218e62793116d42a9f6d14cd9348518b27f382096eea3d0f2d1a24616bb5884

  # fast models: English, Dutch, Indonesian, German, French, Spanish, Italian, Portuguese
  - name: tessdata
    buildsystem: simple
    build-commands:
      - install -Dm644 -t ${FLATPAK_DEST}/share/tessdata *.traineddata
    sources:
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/nld.traineddata
        sha256: ced0e5e046a84c908a6aa7accbef9a232c4a5d9a8276691b81c6ee64d02963f6
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/ind.traineddata
        sha256: 69786901da87ab8766c1ea7fbb10b28f2110c14da3f6c8f2735df131fba95d88
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/deu.traineddata
        sha256: 19d219bbb6672c869d20a9636c6816a81eb9a71796cb93ebe0cb1530e2cdb22d
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/fra.traineddata
        sha256: ced037562e8c80c13122dece28dd477d399af80911a28791a66a63ac1e3445ca
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/spa.traineddata
        sha256: 6f2e04d02774a18f01bed44b1111f2cd7f3ba7ac9dc4373cd3f898a40ea6b464
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/ita.traineddata
        sha256: b8f89e1e785118dac4d51ae042c029a64edb5c3ee42ef73027a6d412748d8827
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/por.traineddata
        sha256: c4932b937207a9514b7514d518b931a99938c02a28a5a5a553f8599ed58b7deb

  - name: jpeg2pdf
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/jpeg2pdf
      - cp -r * ${FLATPAK_DEST}/jpeg2pdf
      - install -Dm755 ${FLATPAK_DEST}/jpeg2pdf/jpeg2pdf.sh ${FLATPAK_DEST}/bin/jpeg2pdf.sh
      - install -Dm644 ${FLATPAK_DEST}/jpeg2pdf/share/icons/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.warlordsoftwares.jpeg2pdf.png
      - install -Dm644 ${FLATPAK_DEST}/jpeg2pdf/share/applications/jpeg2pdf.desktop ${FLATPAK_DEST}/share/applications/com.warlordsoftwares.jpeg2pdf.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/com.warlordsoftwares.jpeg2pdf.desktop
      - install -Dm644 ${FLATPAK_DEST}/jpeg2pdf/share/metainfo/com.warlordsoftwares.jpeg2pdf.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.warlordsoftwares.jpeg2pdf.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/rishabh3354/FLATPAK_JPEG2PDF/archive/refs/tags/2026.10.1.tar.gz
        sha256: b32339dca422a57438c4f81b89f0a05527e721094c3b01129bc36a294640fdea
